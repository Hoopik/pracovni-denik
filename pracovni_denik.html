<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pracovní deník</title><style>*{box-sizing:border-box}body{margin:0;background:#10141d;color:#edf1fa;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px 14px}h1{font-size:26px;margin:0 0 18px}header{position:sticky;top:0;background:#10141d;padding:10px 0;z-index:2}.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}button{background:#29364a;color:white;border:0;border-radius:10px;padding:12px;font:inherit;cursor:pointer}#month{font-size:20px;font-weight:700;text-transform:capitalize}.total{background:#203b50;border-radius:16px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}.total strong{font-size:30px}.day{display:grid;grid-template-columns:70px 85px 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #293342}.date{font-weight:600}.date small{display:block;color:#9caac0;font-weight:400}.weekend .date{color:#f2b778}input{width:100%;min-width:0;background:#1e2837;color:white;border:1px solid #344258;border-radius:8px;padding:10px;font:inherit}input:focus{outline:2px solid #7cc8ff}input.invalid{border-color:#ff7777}p{color:#aab7ca;font-size:13px}.head{color:#aab7ca;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}</style></head><body><main><h1>Pracovní deník</h1><header><div class="nav"><button id="prev" aria-label="Předchozí měsíc">‹</button><span id="month"></span><button id="next" aria-label="Další měsíc">›</button></div><div class="total"><span>Celkem za měsíc</span><strong id="total">0 h</strong></div><div class="day head"><span>Den</span><span>Hodiny</span><span>Místo / poznámka</span></div></header><div id="days"></div><div class="actions"><button id="today">Aktuální měsíc</button><button id="export">Export CSV</button></div><p id="status">Záznamy se ukládají do tohoto prohlížeče. Desetinná čárka i tečka jsou podporovány.</p></main><script>
const $=id=>document.getElementById(id);let data={};try{data=JSON.parse(localStorage.getItem('pracovni-denik-v1')||'{}')}catch(e){}let now=new Date(),y=now.getFullYear(),m=now.getMonth();const key=()=>`${y}-${String(m+1).padStart(2,'0')}`;const fmt=n=>n.toLocaleString('cs-CZ',{maximumFractionDigits:8});function num(s){s=String(s).trim().replace(',','.');return /^(?:\d+(?:\.\d+)?|\.\d+)$/.test(s)&&Number.isFinite(+s)?+s:0}function valid(s){return !s.trim()||/^(?:\d+(?:[,.]\d+)?|[,.]\d+)$/.test(s.trim())&&Number.isFinite(num(s))}function save(){try{localStorage.setItem('pracovni-denik-v1',JSON.stringify(data))}catch(e){$('status').textContent='Uložení se nezdařilo. Použij export CSV, aby se záznamy neztratily.'}}function total(){let n=Object.values(data[key()]||{}).reduce((a,b)=>a+num(b.h||''),0);$('total').textContent=fmt(n)+' h'}function render(){$('month').textContent=new Date(y,m,1).toLocaleDateString('cs-CZ',{month:'long',year:'numeric'});$('days').replaceChildren();let month=data[key()]||(data[key()]={});for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let date=new Date(y,m,d),r=document.createElement('div');r.className='day'+([0,6].includes(date.getDay())?' weekend':'');let label=document.createElement('div');label.className='date';label.textContent=d+'. '+(m+1)+'.';let small=document.createElement('small');small.textContent=date.toLocaleDateString('cs-CZ',{weekday:'short'});label.append(small);let entry=month[d]||(month[d]={h:'',note:''});let h=document.createElement('input');h.inputMode='decimal';h.placeholder='0';h.value=entry.h;h.setAttribute('aria-label','Hodiny '+d+'.');let note=document.createElement('input');note.placeholder='Kde / co';note.value=entry.note;note.setAttribute('aria-label','Poznámka '+d+'.');h.classList.toggle('invalid',!valid(h.value));h.oninput=()=>{entry.h=h.value;h.classList.toggle('invalid',!valid(h.value));save();total()};note.oninput=()=>{entry.note=note.value;save()};r.append(label,h,note);$('days').append(r)}total()}function shift(n){let d=new Date(y,m+n,1);y=d.getFullYear();m=d.getMonth();render()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{let d=new Date();y=d.getFullYear();m=d.getMonth();render()};$('export').onclick=()=>{let quote=s=>'"'+String(s).replace(/"/g,'""')+'"';let rows=['Datum;Hodiny;Poznámka'];for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let e=data[key()][d];rows.push([`${d}.${m+1}.${y}`,e.h,quote(e.note)].join(';'))}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='hodiny-'+key()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
