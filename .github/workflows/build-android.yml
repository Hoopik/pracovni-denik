name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check application source
        run: |
          test -f lib/main.dart
          test -f pubspec.yaml
          test -f icon.jpg
          grep -q "class Diary" lib/main.dart

      - name: Create Android platform
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name pracovni_denik .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Generate custom cat icon
        run: |
          python3 -m venv /tmp/icon-env
          /tmp/icon-env/bin/pip install pillow

          /tmp/icon-env/bin/python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          image = Image.open("icon.jpg")
          image = ImageOps.exif_transpose(image)
          image = image.convert("RGB")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = Path("android/app/src/main/res")

          for density, size in sizes.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  image,
                  (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(folder / "ic_launcher.png")

          print("Cat icon created successfully!")
          PY

      - name: Set application name
        run: |
          sed -i 's/android:label="pracovni_denik"/android:label="Pracovní deník"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pracovni-denik-apk
          path: build/app/outputs/flutter-apk/app-release.apk
